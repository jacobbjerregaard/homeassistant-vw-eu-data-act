name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: API unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The api package imports nothing but the standard library and aiohttp,
        # so it must keep working on the oldest interpreter the claimed Home
        # Assistant floor ships with.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: "actions/checkout@v5"
      - uses: "actions/setup-python@v6"
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run unit tests
        # tests/integration is auto-skipped when HA isn't installed.
        run: pytest

  integration:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v5"
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements_test_ha.txt
      - name: Run integration tests
        run: pytest tests/integration

  coverage:
    name: Combined coverage
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v5"
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements_test_ha.txt
      - name: Run both suites under coverage
        run: |
          coverage run --source=custom_components/vwg_eu_data_act -m pytest
          coverage report --show-missing
      - name: Enforce the floor
        # Only meant to catch a real collapse, not to fail a PR over a
        # percentage point of drift.
        run: coverage report --fail-under=85

# Tooling configuration for the VW Group EU Data Act integration.
# Lint (ruff) and type-check (mypy) settings live here so CI and local runs
# share one source of truth.

[tool.ruff]
# Deliberately below the interpreter CI runs on: hacs.json claims support back
# to HA 2025.3, and targeting a newer Python makes `ruff format` emit syntax
# that older interpreters reject.
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors + warnings (E/W), import sorting (I),
# pyupgrade (UP), bugbear (B) and docstring checks (D).
select = ["E", "W", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test classes and functions document themselves through their names and
# assertions; only module-level docstrings are still required there.
"tests/*" = ["D101", "D102", "D103", "D106", "D107", "D401"]

[tool.mypy]
# The interpreter mypy runs on, not the floor the source targets: Home
# Assistant's own sources use 3.14 syntax, and analysing them under an older
# version fails to parse before it ever reaches this integration. The 3.13
# floor is enforced by ruff's target-version instead.
python_version = "3.14"
# homeassistant / voluptuous don't ship type stubs in this env.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["custom_components/vwg_eu_data_act"]
